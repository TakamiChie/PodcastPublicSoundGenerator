<!doctype html>
<html>

<head>
  <title>Podcast Public Sound Generator(PPSG)</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <h1>Podcast Public Sound Generator(PPSG)</h1>
  <div id="container">
    <form id="mixForm">
      <div class="form-item">
        <label for="audio">ポッドキャスト音声:</label>
        <input type="file" name="audio" id="audio" required accept="audio/*">
      </div>
      <div class="form-item">
        <label for="title">タイトル:</label>
        <input type="text" id="title" name="title">
      </div>
      <div class="form-item">
        <label for="genre">ジャンル:</label>
        <input type="text" id="genre" name="genre">
      </div>
      <div class="form-item">
        <label for="artist">アーティスト:</label>
        <input type="text" id="artist" name="artist" class="savecontrol">
      </div>
      <div class="form-item">
        <label for="date">配信日:</label>
        <input type="date" id="date" name="date">
      </div>
      <div class="form-item">
        <label for="template">カバーアートテンプレート:</label>
        <select id="template" class="savecontrol"></select>
      </div>
      <div class="form-item form-inline">
        <label for="bgm">BGM:</label>
        <select name="bgm" id="bgm" required>
        </select>
        <button type="button" id="previewBtn" class="preview-btn">BGM視聴</button>
      </div>
      <div class="form-item">
        <label for="customBgm">カスタムBGM:</label>
        <input type="file" id="customBgm" name="custom_bgm" accept="audio/*">
      </div>
      <div class="form-item">
        <label for="target_db">目標音量(dB):</label>
        <input type="number" name="target_db" id="target_db" value="80.0" step="0.1" class="savecontrol">
      </div>
      <div class="form-item">
        <label>ノイズ除去:</label>
        <select id="noise_reduction" name="noise_reduction" class="savecontrol">
          <option value="none">なし</option>
          <option value="1stOne">
            最初の一秒をノイズ扱い
          </option>
          <option value="highpass">ハイパスフィルター</option>
        </select>
      </div>
      <a id="archiveDownload" href="#">アーカイブ音声ダウンロード</a>
      <div class="form-item">
        <audio id="previewAudio"></audio>
      </div>
    </form>
    <div id="resultArea">
      <div id="mixAudio">
        <h2>ミックス結果</h2>
        <div class="form-item">
          <label for="mixedRate">再生速度:</label>
          <select id="mixedRate" class="savecontrol">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
            <option value="3">3x</option>
            <option value="4">4x</option>
          </select>
        </div>
        <div class="form-item">
          <audio id="mixedAudio" controls></audio>
        </div>
        <a id="mixedDownload" download="mixed.mp3">ミックス音声ダウンロード</a>
        <div class="form-item">
          <button type="submit" form="mixForm">ミックス音声の再生成</button>
          <div id="mixProgress" class="spinner"></div>
        </div>
      </div>
      <div id="coverArt">
        <h2>カバーアート</h2>
        <div id="coverArea"><iframe title="カバーアートプレビュー" id="coverFrame"></iframe></div>
        <a id="coverDownload" href="#">カバーアートダウンロード</a>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <script src="js/files.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/savecontrol.js"></script>
  <script src="js/html2canvas.min.js"></script>
  <script src="js/cover.js"></script>
  <script src="js/mp3helper.js"></script>
  <script src="js/mix.js"></script>
  <script src="js/archive.js"></script>
  <script src="js/preprocess.js"></script>
</body>

</html>
